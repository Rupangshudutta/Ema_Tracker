# EMA Tracker v2 Docker spare. See docs/RUNBOOK.md.
#   start (standby):        docker compose -f runtimes/docker/compose.yaml up -d --build
#   emergency takeover:     $env:RUNTIME_ROLE='active'; docker compose -f runtimes/docker/compose.yaml up -d
name: ema-tracker

services:
  ema-tracker:
    build:
      context: ../..
      dockerfile: runtimes/docker/Dockerfile
    image: ema-tracker:2
    restart: unless-stopped
    # Time to hand alerts back to Cloudflare and send the stop message before Docker kills the process.
    stop_grace_period: 20s
    env_file:
      - path: ../../.env.docker
        required: true
    environment:
      RUNTIME_ROLE: ${RUNTIME_ROLE:-standby}
    volumes:
      - ema-data:/data
    ports:
      # 8788 on the PC, so it never clashes with npm run cf:dev (8787)
      - "127.0.0.1:8788:8787"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ema-data:
